name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate.py
      - run: npx --yes @anthropic-ai/claude-code@2.1.273 plugin validate . --strict
      - run: npx --yes @anthropic-ai/claude-code@2.1.273 plugin validate .claude-plugin/plugin.json --strict
      - run: npx --yes @anthropic-ai/claude-code@2.1.273 plugin validate skills --strict
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: govtribe-plugin
          path: dist/
